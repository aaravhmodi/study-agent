<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyAgent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
/* Paper, ink and one red pencil. Rules instead of cards, no decorative motion. */
:root{
  --paper:#f7f4ee;--sheet:#fffdf8;--ink:#1d1b18;--ink-2:#55504a;--ink-3:#8a8379;
  --rule:#e3ddd2;--rule-2:#cfc7b9;--pencil:#b4381f;--pencil-wash:#f6e3dc;
  --ok:#2f6b47;--ok-wash:#e4efe6;--warn:#9a5b06;--warn-wash:#f6ecd9;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--sans)}
button,select,textarea,input{font:inherit;color:inherit}
button:not(:disabled){cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.6}
:focus-visible{outline:2px solid var(--pencil);outline-offset:2px}
::selection{background:var(--pencil-wash)}
a{color:var(--ink);text-decoration-color:var(--rule-2);text-underline-offset:3px}
a:hover{text-decoration-color:var(--pencil)}
.hidden{display:none!important}
.muted{color:var(--ink-3)}
.mono{font-family:var(--mono);font-size:.92em}

.shell{max-width:1120px;margin:auto;padding:0 28px 96px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:24px;padding:26px 0 14px;border-bottom:2px solid var(--ink)}
.wordmark{font:600 22px/1 var(--serif);letter-spacing:-.2px}
.wordmark em{font-style:italic;font-weight:400;color:var(--pencil)}
.header-links{display:flex;gap:18px;font-size:13px}
.status-line{margin:10px 0 0;font:13px/1.5 var(--mono);color:var(--ink-2)}
.status-line b{color:var(--ink);font-weight:500}

.label{margin:0;font:600 11.5px/1.4 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
h2{margin:2px 0 0;font:500 24px/1.2 var(--serif);letter-spacing:-.2px}
.section{padding:28px 0;border-bottom:1px solid var(--rule)}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px 16px;margin-bottom:14px;flex-wrap:wrap}

.ask-box{display:grid;gap:10px}
textarea,select{border:1px solid var(--rule-2);border-radius:3px;background:var(--sheet);padding:12px 14px;outline:none}
textarea{width:100%;min-height:96px;resize:vertical;line-height:1.55;font-size:15.5px}
textarea:focus,select:focus{border-color:var(--ink);outline:none;box-shadow:inset 0 0 0 1px var(--ink)}
.ask-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ask-row select{padding:9px 12px}
.hint{margin-left:auto;font:12px var(--mono);color:var(--ink-3)}

.primary-button,.secondary-button,.quiet-button{display:inline-flex;align-items:center;gap:8px;border-radius:3px;padding:9px 16px;font-size:14px;font-weight:500;white-space:nowrap}
.primary-button{background:var(--ink);color:var(--paper);border:1px solid var(--ink)}
.primary-button:hover:not(:disabled){background:#3a3631}
.secondary-button{background:transparent;border:1px solid var(--rule-2)}
.secondary-button:hover:not(:disabled){border-color:var(--ink)}
.quiet-button{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;text-decoration-color:var(--rule-2);text-underline-offset:3px}
.quiet-button:hover{color:var(--ink);text-decoration-color:var(--pencil)}
.spinner{width:12px;height:12px;border-radius:50%;border:1.5px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.try{margin:12px 0 0;font-size:13.5px;color:var(--ink-3)}
.try button{border:0;background:none;padding:0;margin:0 0 0 2px;color:var(--ink-2);text-decoration:underline;text-decoration-color:var(--rule-2);text-underline-offset:3px}
.try button:hover{color:var(--ink);text-decoration-color:var(--pencil)}
.loading{font:13px var(--mono);color:var(--ink-3);padding:8px 0}
.waiting{margin-top:22px;padding:14px 0;border-top:1px solid var(--rule);font:13.5px/1.6 var(--mono);color:var(--ink-2)}
.waiting .slow{display:block;color:var(--ink-3)}

.answer-wrap{margin-top:12px}
.turn{margin-top:28px;padding-top:20px;border-top:1px solid var(--rule)}
.turn-question{margin:0;font:500 17px/1.45 var(--serif);color:var(--ink)}
.turn-question .label{display:block;margin-bottom:2px}
.row.current b{color:var(--pencil)}
.answer-meta{font:12.5px var(--mono);color:var(--ink-3);margin-bottom:8px}
.answer{font-size:16px;line-height:1.7;max-width:70ch;overflow-wrap:anywhere}
.answer.plain{white-space:pre-wrap}
.answer h1,.answer h2,.answer h3{font-family:var(--serif);color:var(--ink);line-height:1.25}
.answer h1{font-size:26px;font-weight:500;margin:28px 0 8px}
.answer h2{font-size:22px;font-weight:500;margin:34px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--rule)}
.answer h3{font-size:18px;font-weight:600;margin:24px 0 4px}
.answer p{margin:10px 0}
.answer strong{font-weight:600}
.answer ul,.answer ol{padding-left:24px}
.answer li{margin:5px 0}
.answer li::marker{color:var(--ink-3)}
.answer blockquote{margin:16px 0;padding:2px 16px;border-left:3px solid var(--pencil);color:var(--ink-2)}
.answer table{border-collapse:collapse;margin:16px 0;font-size:14.5px}
.answer th,.answer td{padding:7px 12px;border:1px solid var(--rule);text-align:left;vertical-align:top}
.answer th{background:var(--sheet);font-weight:600}
.answer code{font:.9em var(--mono);background:var(--sheet);border:1px solid var(--rule);border-radius:2px;padding:0 4px}
.answer pre{background:var(--sheet);border:1px solid var(--rule);padding:12px;overflow-x:auto}
.answer pre code{border:0;padding:0}
.answer hr{border:0;border-top:1px solid var(--rule);margin:24px 0}
.answer .katex{font-size:1.05em}
.answer .katex-display{overflow-x:auto;overflow-y:hidden;padding:6px 0;margin:12px 0}
.answer details{margin:2px 0 14px 24px;border-left:2px solid var(--rule-2);padding:2px 0 2px 14px}
.answer details[open]{border-left-color:var(--pencil)}
.answer summary{cursor:pointer;font:500 13.5px var(--sans);color:var(--ink-2);list-style:none;text-decoration:underline;text-decoration-color:var(--rule-2);text-underline-offset:3px;width:max-content}
.answer summary:hover{text-decoration-color:var(--pencil)}
.answer summary::-webkit-details-marker{display:none}
.answer details[open] .show,.answer details:not([open]) .hide{display:none}
.answer .cite{font:12px var(--mono);color:var(--ink-3);white-space:nowrap}
.answer a.cite{text-decoration:underline;text-decoration-color:var(--rule-2);text-underline-offset:3px}
.answer a.cite:hover{color:var(--ink);text-decoration-color:var(--pencil)}
.answer .cite::before{content:"↳ "}
.answer .online{font:11px var(--mono);color:var(--pencil);border:1px solid currentColor;border-radius:2px;padding:0 3px;margin-left:2px;vertical-align:1px}
.sources{margin:28px 0 0;padding-top:12px;border-top:1px solid var(--rule);font-size:13.5px;max-width:70ch}
.sources ol{margin:6px 0 0;padding-left:22px}
.sources li{margin:3px 0}
.sources .where{font:12px var(--mono);color:var(--ink-3);margin-left:6px}
.figure{margin:20px 0;padding:12px 14px 10px;background:var(--sheet);border:1px solid var(--rule);max-width:70ch}
.figure figcaption{font:500 15px/1.3 var(--serif);color:var(--ink);margin:0 0 8px}
.figure .plot{position:relative;height:280px}
.figure .diagram{overflow-x:auto;text-align:center}
.figure .diagram svg{max-width:100%;height:auto}
.figure .diagram .label{font:inherit;letter-spacing:normal;text-transform:none;color:inherit;margin:0}
.figure .sketch{overflow-x:auto}
.figure .sketch svg{display:block;margin:0 auto;width:100%;max-width:520px;height:auto;max-height:420px}
.figure .figure-error{font:12.5px var(--mono);color:var(--ink-3);margin:0}
.notice{margin-top:18px;padding:10px 14px;border-left:3px solid var(--pencil);background:var(--pencil-wash);font-size:14px}

.index{list-style:none;margin:0;padding:0}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:16px;width:100%;padding:11px 0;border:0;border-top:1px solid var(--rule);background:none;text-align:left}
.index > :first-child,.row:first-child{border-top:0}
button.row:hover b{text-decoration:underline;text-decoration-color:var(--pencil);text-underline-offset:3px}
.row.busy{opacity:.6}
.row b{font-weight:600}
.row .sub{display:block;color:var(--ink-2);font-size:13.5px;margin-top:1px}
.row .side{font:12.5px/1.5 var(--mono);color:var(--ink-3);text-align:right;white-space:nowrap}
.empty{color:var(--ink-3);padding:8px 0;font-size:14px}

.state{font:12px var(--mono);white-space:nowrap;color:var(--ink-2)}
.state::before{content:"";display:inline-block;width:8px;height:8px;margin-right:6px;border:1.5px solid currentColor;vertical-align:0}
.state.overdue{color:var(--pencil)}
.state.overdue::before{background:currentColor}
.state.completed{color:var(--ok)}
.state.completed::before{background:currentColor}
.state.soon{color:var(--warn)}

.table{width:100%;border-collapse:collapse;font-size:14.5px}
.table th{text-align:left;font:600 11.5px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:0 12px 8px 0;border-bottom:1px solid var(--ink)}
.table td{padding:10px 12px 10px 0;border-bottom:1px solid var(--rule);vertical-align:baseline}
.table tbody tr:last-child td{border-bottom:0}
.table td.due{font:13px var(--mono);white-space:nowrap}
.table tbody tr{cursor:pointer}
.table tbody tr:hover .link-button{text-decoration:underline;text-decoration-color:var(--pencil);text-underline-offset:3px}
.table tbody tr.busy{opacity:.6}
.table .hide-lg{display:none}
.link-button{border:0;background:none;padding:0;text-align:left;font-weight:500}

.detail{padding:24px;margin:24px 0 0;background:var(--sheet);border:1px solid var(--rule-2)}
.detail h3{margin:24px 0 6px;font:600 11.5px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.detail .resource{padding:9px 0;border-top:1px solid var(--rule)}
.detail .resource:first-child{border-top:0}
.detail .resource .sub{color:var(--ink-2);font-size:13.5px;margin-top:2px}
.detail ul{padding-left:20px}
.detail .note-help{color:var(--ink-2);font-size:13.5px;margin:0 0 8px}
.detail .note-actions{margin-top:8px}
.detail li{margin:5px 0}
.detail .type{font:12px var(--mono);color:var(--ink-3);margin-left:4px}
.detail .stat{margin:6px 0 0;color:var(--ink-2)}
.detail .actions{display:flex;gap:10px;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:none;background:var(--ink);color:var(--paper);border-radius:3px;padding:10px 16px;font-size:14px;z-index:10;max-width:min(560px,calc(100vw - 32px))}
.toast.show{display:block}
.toast.error{background:var(--pencil)}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:56px}
aside .section-head h2{font-size:19px}

@media (max-width:860px){.layout{grid-template-columns:1fr;gap:0}.detail{padding:18px;margin-top:16px}.detail .section-head{flex-direction:column}.section-head .label{display:none}.detail .section-head .label{display:block}.shell{padding:0 16px 72px}.hint{display:none}.table .hide-sm{display:none}.table .hide-lg{display:inline}}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="wordmark">Study<em>Agent</em></div>
    <nav class="header-links"><a href="/docs">API docs</a></nav>
  </header>
  <p class="status-line" id="status-line">Loading your courses…</p>

  <div class="layout">
    <main>
      <section class="section" aria-labelledby="ask-title">
        <div class="section-head"><h2 id="ask-title">Ask about a lecture or topic</h2><button type="button" class="quiet-button hidden" id="chat-new">New chat</button></div>
        <div class="ask-box">
          <textarea id="chat-question" placeholder="e.g. Explain shear force, or what did Lecture 3 of SYDE 252 cover?"></textarea>
          <div class="ask-row">
            <select id="chat-course" aria-label="Course"><option value="">All courses</option></select>
            <button class="primary-button" id="chat-ask"><span data-label>Ask</span></button>
            <span class="hint">Ctrl+Enter</span>
          </div>
        </div>
        <p class="try" id="try"></p>
        <div id="chat-thread" aria-live="polite"></div>
      </section>

      <section id="detail" class="detail hidden" aria-live="polite"><div id="detail-content"></div></section>

      <section class="section" aria-labelledby="due-title">
        <div class="section-head"><h2 id="due-title">Coming up</h2><span class="label">Open one for what to study</span></div>
        <div id="assessments"><p class="loading">Loading…</p></div>
      </section>
    </main>

    <aside>
      <section class="section" aria-labelledby="chats-title">
        <div class="section-head"><h2 id="chats-title">Recent chats</h2></div>
        <div id="chats" class="index"><p class="loading">Loading…</p></div>
      </section>
      <section class="section" aria-labelledby="courses-title">
        <div class="section-head"><h2 id="courses-title">Courses</h2></div>
        <div id="courses" class="index"><p class="loading">Loading…</p></div>
      </section>
      <section class="section" aria-labelledby="changes-title">
        <div class="section-head"><h2 id="changes-title">Since last sync</h2></div>
        <div id="changes" class="index"><p class="loading">Loading…</p></div>
      </section>
    </aside>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = selector => document.querySelector(selector);
const date = value => value ? new Date(value).toLocaleString([], {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}) : 'No date';
const DAY = 86400000;
// "in 3 days", "tomorrow", "2 days ago": how far away a due date is reads faster than the date.
const until = value => {
  if (!value) return 'no date';
  const days = Math.round((new Date(value) - Date.now()) / DAY);
  if (days === 0) return 'today';
  if (days === 1) return 'tomorrow';
  if (days === -1) return 'yesterday';
  return days > 0 ? `in ${days} days` : `${-days} days ago`;
};
const ago = value => {
  const minutes = Math.round((Date.now() - new Date(value)) / 60000);
  if (minutes < 60) return `${Math.max(minutes, 1)} min ago`;
  const hours = Math.round(minutes / 60);
  return hours < 24 ? `${hours} h ago` : `${Math.round(hours / 24)} d ago`;
};
const statusPill = (status, due) => {
  const soon = status !== 'COMPLETED' && status !== 'OVERDUE' && due && new Date(due) - Date.now() < 3 * DAY;
  const kind = ({OVERDUE: 'overdue', COMPLETED: 'completed'})[status] || (soon ? 'soon' : '');
  const text = ({OVERDUE: 'overdue', COMPLETED: 'done', UNKNOWN: 'no date'})[status] || (soon ? 'due soon' : 'upcoming');
  return `<span class="state ${kind}">${text}</span>`;
};
const resourceLink = r => r.url ? `<a target="_blank" rel="noreferrer" href="${esc(r.url)}">${esc(r.title)}</a>` : esc(r.title);
const loading = what => `<p class="loading">${esc(what)}…</p>`;

async function getJson(path, options) {
  const response = await fetch(path, options);
  if (!response.ok) {
    let message = await response.text();
    try { message = JSON.parse(message).detail || message } catch (_) {}
    throw new Error(message);
  }
  return response.json();
}

let toastTimer;
function toast(message, kind = '') {
  const el = $('#toast');
  el.className = `toast show ${kind}`;
  el.textContent = message;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast' }, kind === 'error' ? 6000 : 2600);
}

// Show work in progress on the button that started it.
function setBusy(button, label) {
  if (!button) return () => {};
  const original = button.innerHTML;
  button.disabled = true;
  button.classList.add('busy');
  if (label) button.innerHTML = `<span class="spinner" aria-hidden="true"></span><span>${esc(label)}</span>`;
  return () => { button.disabled = false; button.classList.remove('busy'); button.innerHTML = original };
}

// Math is rendered by KaTeX before Markdown parsing so Markdown cannot eat
// LaTeX backslashes/underscores; placeholders are swapped back after
// DOMPurify sanitizes the Markdown HTML.
function renderAnswer(text, citations = []) {
  if (!window.marked || !window.DOMPurify || !window.katex) return `<div class="answer plain">${esc(text)}</div>`;
  const math = [], hidden = [];
  const keep = (tex, display) => { math.push(katex.renderToString(tex.trim(), {displayMode: display, throwOnError: false})); return `%%MATH${math.length - 1}%%` };
  const source = String(text)
    .replace(/\$\$([\s\S]+?)\$\$/g, (_, tex) => keep(tex, true))
    .replace(/\\\[([\s\S]+?)\\\]/g, (_, tex) => keep(tex, true))
    .replace(/\\\(([\s\S]+?)\\\)/g, (_, tex) => keep(tex, false))
    .replace(/(^|[^\\$\w])\$(?!\s)([^$\n]+?)(?<!\s)\$(?![\w$])/g, (_, before, tex) => before + keep(tex, false))
    // Markdown would split a hidden answer out of its <details> box, so each
    // one is rendered on its own and dropped back in as a block.
    .replace(/<details>\s*<summary>([\s\S]*?)<\/summary>([\s\S]*?)<\/details>/g, (_, _summary, inner) => {
      hidden.push(`<details><summary><span class="show">Show answer</span><span class="hide">Hide answer</span></summary>${marked.parse(inner.trim(), {gfm: true})}</details>`);
      return `\n\n%%HIDDEN${hidden.length - 1}%%\n\n`;
    });
  const html = DOMPurify.sanitize(marked.parse(source, {gfm: true})
    .replace(/(?:<p>)?%%HIDDEN(\d+)%%(?:<\/p>)?/g, (_, index) => hidden[Number(index)]));
  // The tutor marks web-sourced sentences "(online)"; tag them so they stand apart from course material.
  const tagged = html
    .replace(/\s?\(online\)/g, ' <span class="online" title="From the web, not your course files">online</span>')
    // Inline [file.pdf] citations become quiet references instead of bracketed noise.
    .replace(/\[([^\]<>\n]+?\.(?:pdf|txt|docx?|pptx|md|html|tex))(?:,\s*(pp?\.\s*[\d\u2013-]+))?\]/gi, (_, name, page) => citeLink(name, citations, page));
  return `<div class="answer">${tagged.replace(/%%MATH(\d+)%%/g, (_, index) => math[Number(index)])}</div>`;
}

// The server validates every figure and computes every plotted point, so the
// page only draws. Libraries load on first use to keep the dashboard light.
const LIBRARIES = {
  chart: 'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js',
  mermaid: 'https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js',
};
const loadedLibraries = {};
function loadLibrary(name) {
  return loadedLibraries[name] ||= new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = LIBRARIES[name];
    script.onload = resolve;
    script.onerror = () => { delete loadedLibraries[name]; reject(new Error(`could not load ${name}`)) };
    document.head.append(script);
  });
}

const token = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const PLOT_COLOURS = ['--ink', '--pencil', '#3d6a8a', '--ok', '--warn', '#6b4f8a'];
const withAlpha = (hex, alpha) => hex + Math.round(alpha * 255).toString(16).padStart(2, '0');
const shortNumber = value => Number(Number(value).toPrecision(4));

// Dashed lines for loads or limits (x only) and labelled dots (x and y).
const markerPlugin = {
  id: 'markers',
  afterDatasetsDraw(chart, _args, options) {
    const {ctx, chartArea: area, scales: {x, y}} = chart;
    ctx.save();
    ctx.font = `12px ${token('--mono')}`;
    ctx.fillStyle = ctx.strokeStyle = token('--pencil');
    for (const marker of options.items || []) {
      const px = x.getPixelForValue(marker.x);
      if (marker.y == null) {
        ctx.setLineDash([4, 4]);
        ctx.beginPath(); ctx.moveTo(px, area.top); ctx.lineTo(px, area.bottom); ctx.stroke();
        ctx.setLineDash([]);
        if (marker.label) ctx.fillText(marker.label, Math.min(px + 5, area.right - ctx.measureText(marker.label).width), area.top + 12);
      } else {
        const py = y.getPixelForValue(marker.y);
        ctx.beginPath(); ctx.arc(px, py, 4, 0, 2 * Math.PI); ctx.fill();
        if (!marker.label) continue;
        // Keep the label inside the plot, flipping it below or left of the dot near an edge.
        const width = ctx.measureText(marker.label).width;
        const lx = px + 7 + width > area.right ? px - 7 - width : px + 7;
        ctx.fillText(marker.label, lx, py - 7 < area.top + 12 ? py + 16 : py - 7);
      }
    }
    ctx.restore();
  },
};

async function drawPlot(holder, figure) {
  holder.innerHTML = `${figure.title ? `<figcaption>${esc(figure.title)}</figcaption>` : ''}<div class="plot"><canvas role="img" aria-label="${esc(figure.title || 'Graph')}"></canvas></div>`;
  await loadLibrary('chart');
  Chart.defaults.font.family = token('--sans');
  const ink2 = token('--ink-2'), rule = token('--rule'), ink3 = token('--ink-3');
  let colour = 0, current = token('--ink');
  const datasets = figure.series.map(series => {
    // A shaded range follows the colour of the curve it belongs to.
    if (series.legend) { const pick = PLOT_COLOURS[colour++ % PLOT_COLOURS.length]; current = pick.startsWith('--') ? token(pick) : pick }
    return {
      label: series.label,
      data: series.points.map(([x, y]) => ({x, y})),
      showLine: series.style === 'line',
      pointRadius: series.style === 'points' ? 3.5 : 0,
      pointHoverRadius: series.style === 'points' ? 5 : 3,
      borderWidth: series.legend ? 2 : 0,
      borderColor: current,
      backgroundColor: series.fill ? withAlpha(current, series.legend ? 0.1 : 0.25) : current,
      fill: series.fill ? 'origin' : false,
      spanGaps: false,
      order: series.legend ? 0 : 1,
    };
  });
  const axis = (label, min, max) => ({
    type: 'linear', min: min ?? undefined, max: max ?? undefined, grace: '8%',
    title: {display: Boolean(label), text: label, color: ink2},
    ticks: {color: ink3, maxTicksLimit: 9},
    grid: {color: context => context.tick?.value === 0 ? ink3 : rule},
    border: {display: false},
  });
  const named = figure.series.filter(series => series.legend && series.label);
  new Chart(holder.querySelector('canvas'), {
    type: 'scatter',
    data: {datasets},
    plugins: [markerPlugin],
    options: {
      responsive: true, maintainAspectRatio: false, animation: {duration: 300},
      interaction: {mode: 'nearest', axis: 'x', intersect: false},
      scales: {x: axis(figure.x_label, figure.x_min, figure.x_max), y: axis(figure.y_label, figure.y_min, figure.y_max)},
      plugins: {
        legend: {display: named.length > 1, labels: {color: ink2, boxWidth: 14, filter: item => figure.series[item.datasetIndex].legend}},
        tooltip: {
          filter: item => figure.series[item.datasetIndex].legend,
          callbacks: {label: item => `${item.dataset.label ? item.dataset.label + ': ' : ''}x = ${shortNumber(item.parsed.x)}, y = ${shortNumber(item.parsed.y)}`},
        },
        markers: {items: figure.markers},
      },
    },
  });
}

// Concept diagrams: strict Mermaid with plain SVG labels, sanitized again before insertion.
let diagramCount = 0;
async function drawDiagram(holder, figure) {
  await loadLibrary('mermaid');
  if (!drawDiagram.ready) {
    mermaid.initialize({
      // SVG text labels instead of HTML in foreignObject, so sanitizing keeps them.
      startOnLoad: false, securityLevel: 'strict', theme: 'base', htmlLabels: false,
      flowchart: {htmlLabels: false, curve: 'basis'},
      themeVariables: {
        fontFamily: token('--sans'), fontSize: '14px',
        primaryColor: token('--sheet'), primaryBorderColor: token('--ink'), primaryTextColor: token('--ink'),
        lineColor: token('--ink-2'), secondaryColor: token('--pencil-wash'), tertiaryColor: token('--paper'),
        edgeLabelBackground: token('--paper'),
      },
    });
    drawDiagram.ready = true;
  }
  const {svg} = await mermaid.render(`diagram-${++diagramCount}`, figure.source);
  holder.innerHTML = `<div class="diagram">${DOMPurify.sanitize(svg, {USE_PROFILES: {svg: true, svgFilters: true}})}</div>`;
}

// Sketches (free-body diagrams, circuits, any drawing) arrive as server-sanitized SVG.
function drawSketch(holder, figure) {
  // dominant-baseline places circuit labels above or below a part; paint-order gives labels a halo.
  const svg = DOMPurify.sanitize(figure.svg, {USE_PROFILES: {svg: true, svgFilters: true}, ADD_ATTR: ['dominant-baseline', 'paint-order']});
  holder.innerHTML = `${figure.title ? `<figcaption>${esc(figure.title)}</figcaption>` : ''}<div class="sketch">${svg}</div>`;
}

// The answer marks each figure's place with a ```figure block holding its index.
async function drawFigures(answer, figures) {
  if (!answer || !figures.length) return;
  const slots = new Map();
  answer.querySelectorAll('pre > code.language-figure').forEach(code => {
    const holder = document.createElement('figure');
    holder.className = 'figure';
    code.parentElement.replaceWith(holder);
    slots.set(Number(code.textContent.trim()), holder);
  });
  await Promise.all(figures.map(async (figure, index) => {
    let holder = slots.get(index);
    if (!holder) { holder = document.createElement('figure'); holder.className = 'figure'; answer.append(holder) }
    try {
      if (figure.kind === 'plot') await drawPlot(holder, figure);
      else if (figure.kind === 'sketch') drawSketch(holder, figure);
      else await drawDiagram(holder, figure);
    } catch (error) {
      holder.innerHTML = `<p class="figure-error">This figure could not be drawn (${esc(error.message || error)}).</p>`;
    }
  }));
}

// /chat returns one response with no progress events, so show only what is
// true: what is being searched and how long it has taken.
function startWaiting(container, course) {
  const scope = course ? `${course} files` : 'files from every course';
  container.innerHTML = `<p class="waiting" role="status">Searching ${esc(scope)} and the web, then writing <span data-time>0 s</span><span class="slow hidden" data-slow>Long answers with worked examples can take a minute or two.</span></p>`;
  const time = container.querySelector('[data-time]');
  const slow = container.querySelector('[data-slow]');
  const started = Date.now();
  const tick = () => {
    const seconds = Math.floor((Date.now() - started) / 1000);
    time.textContent = `· ${seconds} s`;
    slow.classList.toggle('hidden', seconds < 30);
  };
  tick();
  const timer = setInterval(tick, 1000);
  return {elapsed: () => Date.now() - started, stop: () => clearInterval(timer)};
}

// Token cost of an answer, e.g. " · 9.8k tokens (7.1k cached)".
function tokenNote(usage) {
  if (!usage) return '';
  const k = n => n >= 1000 ? `${(n / 1000).toFixed(1)}k` : String(n);
  const total = usage.input_tokens + usage.output_tokens;
  return ` · ${k(total)} tokens${usage.cached_tokens ? ` (${k(usage.cached_tokens)} cached)` : ''}`;
}

// Course files first, then web pages; web entries are links labelled with their site.
const safeUrl = url => /^https?:\/\//.test(url || '') ? url : '';
// Where a link opens, in words: LEARN, the course outline, or the site's name.
function whereLabel(url) {
  const host = new URL(url).hostname.replace(/^www\./, '');
  return ({'learn.uwaterloo.ca': 'LEARN', 'outline.uwaterloo.ca': 'course outline'})[host] || host;
}
const openLink = (url, text, extra = '') => `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer"${extra}>${text}</a>`;

// An inline [file.pdf] citation, linked to the file's LEARN page when the answer cites it.
function citeLink(name, citations, page = '') {
  const key = value => String(value || '').toLowerCase().replace(/\.\w+$/, '');
  const source = citations.find(c => c.kind !== 'web' && key(c.filename) === key(name));
  const label = name.replace(/[_-]+/g, ' ').replace(/\.\w+$/, '') + (page ? `, ${page}` : '');
  const url = safeUrl(source?.url);
  if (!url) return `<span class="cite" title="Course file">${label}</span>`;
  return openLink(url, label, ` class="cite" title="Open ${esc(source.title || name)} on ${esc(whereLabel(url))}"`);
}

// Course files first (linked to LEARN), then web pages; each says where it opens.
function renderSources(citations) {
  if (!citations.length) return '';
  const files = citations.filter(c => c.kind !== 'web');
  const web = citations.filter(c => c.kind === 'web' && safeUrl(c.url));
  const item = c => {
    const url = safeUrl(c.url);
    const name = esc(c.title || c.filename);
    if (!url) return `<li>${name}<span class="where">course file</span></li>`;
    const file = c.kind !== 'web' && c.title && c.title !== c.filename ? ` title="${esc(c.filename)}"` : '';
    return `<li>${openLink(url, name, file)}<span class="where">${esc(whereLabel(url))}</span></li>`;
  };
  return `<div class="sources"><p class="label">Sources</p><ol>${files.concat(web).map(item).join('')}</ol></div>`;
}

// Suggestions come from the student's own work, e.g. the next test on the calendar.
function renderSuggestions(data) {
  const nextTest = data.assessments.find(a => a.status !== 'COMPLETED' && a.status !== 'OVERDUE' && /test|midterm|exam|quiz/i.test(`${a.type} ${a.title}`));
  const firstCourse = [...data.courses].map(c => c.code).filter(Boolean).sort()[0];
  const ideas = [
    nextTest && [`What should I review for the ${nextTest.course} ${nextTest.title}?`, nextTest.course],
    firstCourse && [`What did Lecture 1 of ${firstCourse} cover?`, firstCourse],
    ['Explain shear force.', data.courses.some(c => c.code === 'SYDE 286') ? 'SYDE 286' : ''],
  ].filter(Boolean);
  $('#try').innerHTML = 'Try: ' + ideas.map(([text, course]) => `<button type="button" data-ask="${esc(text)}" data-course="${esc(course || '')}">${esc(text)}</button>`).join('<span aria-hidden="true"> · </span>');
}

// The open conversation; follow-ups are sent with its id so the tutor sees earlier turns.
let currentSession = null;

function turnMeta(result, course, seconds) {
  const where = course ? esc(course) : '';
  if (result.cached) return [where, 'saved answer, no tokens used · <button type="button" class="quiet-button" data-fresh>ask fresh</button>'].filter(Boolean).join(' · ');
  const tokens = tokenNote(result.usage).replace(/^ · /, '');
  return [where, seconds == null ? '' : `answered in ${seconds} s`, tokens].filter(Boolean).join(' · ');
}

// One question and its answer, appended to the thread.
function appendTurn(question, result, meta) {
  const turn = document.createElement('article');
  turn.className = 'turn';
  turn.innerHTML = `<p class="turn-question"><span class="label">You asked</span>${esc(question)}</p>
    <div class="answer-wrap">
      <p class="answer-meta">${meta}</p>
      ${renderAnswer(result.answer, result.citations || [])}
      ${renderSources(result.citations || [])}
    </div>`;
  $('#chat-thread').append(turn);
  drawFigures(turn.querySelector('.answer'), result.figures || []);
  turn.querySelector('[data-fresh]')?.addEventListener('click', () => askFresh(question));
  return turn;
}

function setConversation(id) {
  currentSession = id;
  $('#chat-new').classList.toggle('hidden', !id);
  $('#chat-question').placeholder = id
    ? 'Ask a follow-up, e.g. why is that? or show me an example'
    : 'e.g. Explain shear force, or what did Lecture 3 of SYDE 252 cover?';
}

function newChat() {
  setConversation(null);
  $('#chat-thread').innerHTML = '';
  $('#chat-question').value = '';
  $('#chat-question').focus();
}

async function askChat(fresh = false, questionText = null) {
  const button = $('#chat-ask');
  const question = (questionText ?? $('#chat-question').value).trim();
  if (!question) { $('#chat-question').focus(); toast('Type a question first.'); return }
  const course = $('#chat-course').value || null;
  const done = setBusy(button, currentSession ? 'Asking follow-up' : 'Asking');
  const pending = document.createElement('div');
  $('#chat-thread').append(pending);
  const progress = startWaiting(pending, course);
  pending.scrollIntoView({behavior: 'smooth', block: 'nearest'});
  try {
    const result = await getJson('/chat', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({question, course_code: course, fresh, session_id: currentSession})});
    progress.stop();
    pending.remove();
    setConversation(result.session_id || null);
    appendTurn(question, result, turnMeta(result, course, Math.round(progress.elapsed() / 1000))).scrollIntoView({behavior: 'smooth', block: 'start'});
    $('#chat-question').value = '';
    loadChats();
  } catch (error) {
    progress.stop();
    pending.innerHTML = `<div class="notice">${esc(error.message || error)}</div>`;
  } finally {
    done();
  }
}

// A saved answer was reused; drop that one-turn chat and ask again from scratch.
async function askFresh(question) {
  const stale = currentSession;
  newChat();
  if (stale) await getJson(`/chat/sessions/${stale}`, {method: 'DELETE'}).catch(() => {});
  await askChat(true, question);
}

async function openChat(id, row) {
  await withRowBusy(row, async () => {
    const session = await getJson(`/chat/sessions/${encodeURIComponent(id)}`);
    newChat();
    setConversation(session.id);
    if (session.course_code) $('#chat-course').value = session.course_code;
    for (const turn of session.turns) {
      appendTurn(turn.question, turn.response, turnMeta(turn.response, turn.course_code, null) || esc(date(turn.asked_at)));
    }
    $('#chat-thread').scrollIntoView({behavior: 'smooth', block: 'start'});
  });
}

async function loadChats() {
  const chats = await getJson('/chat/sessions').catch(() => []);
  $('#chats').innerHTML = chats.length
    ? chats.slice(0, 12).map(c => `<button class="row${c.id === currentSession ? ' current' : ''}" data-session="${esc(c.id)}"><span><b>${esc(c.title)}</b><span class="sub">${c.course_code ? `${esc(c.course_code)} · ` : ''}${c.turns} ${c.turns === 1 ? 'question' : 'questions'}</span></span><span class="side">${esc(ago(c.updated_at))}</span></button>`).join('')
    : '<div class="empty">Your conversations with the tutor will appear here.</div>';
}

function showDetail(html) {
  const detail = $('#detail');
  $('#detail-content').innerHTML = html;
  detail.classList.remove('hidden');
}
function closeDetail() { $('#detail').classList.add('hidden') }
function openingDetail(what) {
  showDetail(loading(`Opening ${what}`));
  $('#detail').scrollIntoView({behavior: 'smooth', block: 'start'});
}

async function withRowBusy(row, work) {
  row?.classList.add('busy');
  try { await work() } finally { row?.classList.remove('busy') }
}

async function openCourse(id, name, row) {
  openingDetail(name || 'course');
  await withRowBusy(row, async () => {
    const c = await getJson(`/courses/${encodeURIComponent(id)}`);
    showDetail(`<div>
      <div class="section-head"><div><p class="label">${esc(c.term || 'Course')}</p><h2>${esc(c.code || c.name)}: ${esc(c.name)}</h2></div><button class="secondary-button" data-close>Close</button></div>
      <p class="stat"><b>${c.completed_assessments}</b> of <b>${c.assessments.length}</b> assessments completed · <b>${c.resources.length}</b> collected resources</p>
      <h3>Your notes for this course</h3>
      <p class="sub note-help">What your instructor said that isn't on LEARN, like what a midterm covers. The tutor reads these with every question about ${esc(c.code || c.name)}.</p>
      <textarea id="course-note" maxlength="4000" placeholder="e.g. Midterm Oct 20: chapters 1-4, Major Topic 1, two R coding questions, 40 multiple choice.">${esc(c.note || '')}</textarea>
      <div class="note-actions"><button class="secondary-button" data-save-note="${esc(c.id)}">Save notes</button></div>
      <h3>Assessments</h3><div>${c.assessments.length ? c.assessments.map(a => `<button class="row" data-assessment="${esc(a.id)}" data-name="${esc(a.title)}"><span><b>${esc(a.title)}</b><span class="sub">${esc(a.type)} · ${esc(date(a.due_at))}</span></span><span class="side">${statusPill(a.status, a.due_at)}</span></button>`).join('') : '<div class="empty">No assessments found.</div>'}</div>
      <h3>Coursework you have</h3><div>${c.resources.length ? c.resources.map(r => `<div class="resource"><b>${resourceLink(r)}</b> <span class="type">${esc(String(r.type || '').toLowerCase())}</span>${r.description ? `<div class="sub">${esc(r.description)}</div>` : ''}</div>`).join('') : '<div class="empty">No resources found.</div>'}</div>
      <h3>Announcements</h3><div>${c.announcements.length ? c.announcements.slice(0, 10).map(a => `<div class="resource"><b>${esc(a.title)}</b><div class="sub">${esc(a.body || '')}</div></div>`).join('') : '<div class="empty">No announcements stored.</div>'}</div>
    </div>`);
  });
}

async function openAssessment(id, name, row) {
  openingDetail(name || 'assessment');
  await withRowBusy(row, async () => {
    const a = await getJson(`/assessments/${encodeURIComponent(id)}`);
    const action = a.status === 'COMPLETED'
      ? `<button class="secondary-button" data-reopen="${esc(a.id)}">Mark not completed</button>`
      : `<button class="primary-button" data-complete="${esc(a.id)}">Mark completed</button>`;
    showDetail(`<div>
      <div class="section-head"><div><p class="label">${esc(a.course)} · ${esc(a.type)}</p><h2>${esc(a.title)}</h2><p class="stat"><span class="mono">Due ${esc(date(a.due_at))} (${esc(until(a.due_at))})</span> · ${statusPill(a.status, a.due_at)}${a.weight_percent == null ? '' : ` · ${esc(a.weight_percent)}% of grade`}</p></div><div class="actions">${action}<button class="secondary-button" data-ask="${esc(`What should I review for the ${a.course} ${a.title}?`)}" data-course="${esc(a.course)}">Ask how to study for this</button><button class="secondary-button" data-close>Close</button></div></div>
      ${a.description ? `<p class="stat">${esc(a.description)}</p>` : ''}
      <h3>Relevant coursework</h3><div>${a.coursework.length ? a.coursework.map(r => `<div class="resource"><b>${resourceLink(r)}</b> <span class="type">${esc(String(r.type || '').toLowerCase())}</span><div class="sub">${esc(r.match_reason)}</div>${r.description ? `<div class="sub">${esc(r.description)}</div>` : ''}</div>`).join('') : '<div class="empty">No matching course resources yet. Run sync after the instructor posts material.</div>'}</div>
      <h3>How to study for it</h3><ul>${a.study_guidance.map(step => `<li>${esc(step)}</li>`).join('')}</ul>
    </div>`);
  });
}

async function changeStatus(id, action, button) {
  const done = setBusy(button, 'Saving…');
  try {
    await getJson(`/assessments/${encodeURIComponent(id)}/${action}`, {method: 'POST'});
    await load();
    await openAssessment(id);
    toast(action === 'complete' ? '✓  Marked completed' : 'Marked not completed');
  } catch (error) {
    done();
    toast(`Could not save this change: ${error.message || error}`, 'error');
  }
}

async function load() {
  const data = await getJson('/api/dashboard');
  const sync = data.last_sync;
  const open = data.assessments.filter(a => a.status !== 'COMPLETED').length;
  $('#status-line').innerHTML = `<b>${data.courses.length}</b> courses · <b>${open}</b> assessments open · <b>${sync?.resources_found ?? 0}</b> files · `
    + (sync?.finished_at ? `synced ${esc(ago(sync.finished_at))} <span class="muted">(${esc(date(sync.finished_at))})</span>` : 'not synced yet: run <code>study-agent sync</code>');

  renderSuggestions(data);

  const select = $('#chat-course');
  const chosen = select.value;
  select.innerHTML = '<option value="">All courses</option>' + data.courses.filter(c => c.code).map(c => `<option value="${esc(c.code)}">${esc(c.code)}</option>`).join('');
  select.value = chosen;

  const courses = [...data.courses].sort((a, b) => (a.code || a.name).localeCompare(b.code || b.name, undefined, {numeric: true}));
  $('#courses').innerHTML = courses.length ? courses.map(c => `<button class="row" data-course="${esc(c.id)}" data-name="${esc(c.code || c.name)}"><span><b>${esc(c.code || c.name)}</b><span class="sub">${esc(c.name)}</span></span><span class="side">${c.completed_assessment_count}/${c.assessment_count} done</span></button>`).join('') : '<div class="empty">Run sync to discover courses.</div>';
  $('#changes').innerHTML = data.changes.length ? data.changes.map(c => `<div class="row"><span class="sub">${esc(c.description)}</span><span class="side">${esc(ago(c.detected_at))}</span></div>`).join('') : '<div class="empty">No stored change events yet.</div>';
  $('#assessments').innerHTML = data.assessments.length ? `<table class="table"><thead><tr><th>Due</th><th>Assessment</th><th class="hide-sm">Course</th><th>Status</th></tr></thead><tbody>${data.assessments.map(a => `<tr data-assessment="${esc(a.id)}" data-name="${esc(a.title)}"><td class="due" title="${esc(date(a.due_at))}">${esc(until(a.due_at))}</td><td><button class="link-button">${esc(a.title)}</button><span class="sub hide-lg"> · ${esc(a.course)}</span></td><td class="hide-sm">${esc(a.course)}</td><td>${statusPill(a.status, a.due_at)}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">No assessments stored yet.</div>';
}

const fail = error => toast(error.message || String(error), 'error');
$('#chat-ask').addEventListener('click', () => askChat());
$('#chat-new').addEventListener('click', newChat);
$('#chats').addEventListener('click', event => {
  const row = event.target.closest('[data-session]');
  if (row) openChat(row.dataset.session, row).catch(fail);
});
function fillQuestion(question, course) {
  // A suggested question starts its own conversation.
  if (currentSession) newChat();
  $('#chat-question').value = question;
  $('#chat-course').value = course || '';
  $('#chat-question').scrollIntoView({behavior: 'smooth', block: 'center'});
  $('#chat-question').focus({preventScroll: true});
}
$('#try').addEventListener('click', event => {
  const idea = event.target.closest('[data-ask]');
  if (idea) fillQuestion(idea.dataset.ask, idea.dataset.course);
});
$('#chat-question').addEventListener('keydown', event => { if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') askChat() });
$('#courses').addEventListener('click', event => {
  const row = event.target.closest('[data-course]');
  if (row) openCourse(row.dataset.course, row.dataset.name, row).catch(fail);
});
$('#assessments').addEventListener('click', event => {
  const row = event.target.closest('[data-assessment]');
  if (row) openAssessment(row.dataset.assessment, row.dataset.name, row).catch(fail);
});
$('#detail').addEventListener('click', event => {
  const target = event.target.closest('button');
  if (!target) return;
  if (target.hasAttribute('data-close')) { closeDetail(); return }
  if (target.dataset.ask) { fillQuestion(target.dataset.ask, target.dataset.course); return }
  if (target.dataset.assessment) { openAssessment(target.dataset.assessment, target.dataset.name, target).catch(fail); return }
  if (target.dataset.complete) { changeStatus(target.dataset.complete, 'complete', target); return }
  if (target.dataset.reopen) { changeStatus(target.dataset.reopen, 'reopen', target); return }
  if (target.dataset.saveNote) saveCourseNote(target.dataset.saveNote, target);
});
async function saveCourseNote(id, button) {
  const done = setBusy(button, 'Saving');
  try {
    const result = await getJson(`/courses/${encodeURIComponent(id)}/note`, {method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({text: $('#course-note').value})});
    toast(result.text ? `Notes saved for ${result.course}` : `Notes cleared for ${result.course}`);
  } catch (error) {
    toast(error.message || String(error), 'error');
  } finally {
    done();
  }
}

loadChats();
load().catch(error => {
  $('#status-line').textContent = 'Could not load your courses.';
  fail(error);
});
</script>
</body>
</html>
