[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "study-agent"
version = "0.1.0"
description = "Local-first AI academic agent for Waterloo LEARN."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "fonttools>=4,<5",
  "openai>=1.100,<2",
  "pillow>=11,<13",
  "pypdf>=5,<7",
  "pypdfium2>=4.30,<6",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "python-dotenv>=1.1,<2",
  "rich>=14,<15",
  "sqlalchemy>=2.0,<3",
  "tzdata>=2025.2",
  "typer>=0.16,<1",
  "uvicorn>=0.30,<1",
  "schemdraw>=0.23,<1",
]

[project.scripts]
study-agent = "app.cli.commands:app"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", ".venv312"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true
